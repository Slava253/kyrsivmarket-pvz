<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Курсив Маркет — ПВЗ</title>
<style>
:root{--bg:#0b1020;--card:#141b33;--card2:#1b2444;--text:#e8ecff;--muted:#8b95c2;
  --accent:#5b7cff;--accent2:#7c5bff;--ok:#25d18a;--err:#ff5b6e;--warn:#ffc107;
  --blue:#5b9cff;--border:#26305a}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1200px 800px at 20% -10%, #1a2350, #0b1020 60%);
  color:var(--text);min-height:100vh}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.logo-sm{font-weight:700}
.logo-sm span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.content{padding:16px;flex:1;padding-bottom:40px}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.section-title{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:700;font-size:15px}
.section-title .pill{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:600;letter-spacing:.4px}
.pill.issue{background:rgba(37,209,138,.15);color:var(--ok)}
.pill.intake{background:rgba(91,156,255,.15);color:var(--blue)}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
  background:#0f1530;color:var(--text);font-size:15px;margin-bottom:10px;font-family:inherit;outline:none}
.input:focus{border-color:var(--accent)}
.code-input{letter-spacing:8px;text-align:center;font-size:22px;font-family:monospace}
.btn{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:inherit;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.btn.ok{background:var(--ok)}
.btn.blue{background:linear-gradient(135deg,#4b8cff,#6b6bff)}
.btn:disabled{opacity:.5;cursor:wait}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.panel{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px}
.brand{text-align:center;margin-bottom:20px}
.logo{width:56px;height:56px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-bottom:10px}
.err{color:var(--err);font-size:13px;min-height:18px;margin-bottom:8px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-body{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;
  width:100%;max-width:440px;max-height:92vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head b{font-size:17px}
.close-btn{background:transparent;border:1px solid var(--border);color:var(--muted);width:32px;height:32px;
  border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
#qrReaderIssue,#qrReaderIntake{width:100%;min-height:220px;border-radius:14px;overflow:hidden;
  background:#0a1024;border:1px solid var(--border)}
#qrReaderIssue video,#qrReaderIntake video{border-radius:14px}
.cell-display{text-align:center;padding:24px;background:linear-gradient(135deg,#243066,#3a2a6e);
  border-radius:20px;margin-bottom:16px}
.cell-num{font-size:56px;font-weight:800;color:#fff;line-height:1}
.cell-label{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.info-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.info-row span:first-child{color:var(--muted)}
.hist{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card2);border-radius:10px;margin-bottom:6px;font-size:13px}
.hist-icon{width:32px;height:32px;border-radius:8px;background:rgba(37,209,138,.15);color:var(--ok);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hist-icon.blue{background:rgba(91,156,255,.15);color:var(--blue)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;
  background:var(--card2);border:1px solid var(--border);font-size:14px;z-index:9999;animation:up .2s;max-width:90vw}
.toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--err)}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<div id="issueScanModal" class="modal">
  <div class="modal-body">
    <div class="modal-head"><b>Сканировать QR клиента</b>
      <button class="close-btn" id="btnIssueScanClose">✕</button></div>
    <div id="qrReaderIssue"></div>
    <p class="muted small" style="text-align:center;margin:14px 0 8px">или введите 6-значный код</p>
    <input id="issueCodeInput" class="input code-input" inputmode="numeric" maxlength="6" placeholder="000000"/>
    <button class="btn" id="btnIssueCodeGo">Найти заказ</button>
  </div>
</div>

<div id="intakeScanModal" class="modal">
  <div class="modal-body">
    <div class="modal-head"><b>Сканировать QR коробки</b>
      <button class="close-btn" id="btnIntakeScanClose">✕</button></div>
    <div id="qrReaderIntake"></div>
    <p class="muted small" style="text-align:center;margin:14px 0 8px">или введите код коробки</p>
    <input id="intakeCodeInput" class="input" placeholder="box000000000" autocomplete="off"/>
    <button class="btn blue" id="btnIntakeCodeGo">Принять коробку</button>
  </div>
</div>

<div id="resultModal" class="modal">
  <div class="modal-body" id="resultBody"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBlZ5ZtyTXgtXxSJAx1jOxwhTrzlHRJmo",
  authDomain: "bk-cashier.firebaseapp.com",
  databaseURL: "https://bk-cashier-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bk-cashier",
  storageBucket: "bk-cashier.firebasestorage.app",
  messagingSenderId: "385000840969",
  appId: "1:385000840969:web:1ec8d09176b6551dc0fdd8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
db.goOnline();

const fmt = n => new Intl.NumberFormat('ru-RU').format(Number(n)||0) + ' ₽';
const digits = v => String(v||'').replace(/\D/g,'');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast ' + (type||'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

function statusLabel(s){
  if (s === 'pending' || s === 'transit') return 'В пути';
  if (s === 'ready') return 'Готов к выдаче';
  if (s === 'issued') return 'Выдан';
  return s || '—';
}
function getPvzCity(pvz){
  if (!pvz) return '';
  if (pvz.city) return pvz.city;
  const parts = String(pvz.address||'').split(',');
  return parts[0] ? parts[0].trim() : '';
}

const state = { pvzId: null, pvz: null, recent: {}, intakeRecent: {}, scanResult: null, intakeResult: null, pvzOrders: {} };
let unsubPvz = null, unsubRecent = null, unsubIntakeRecent = null, unsubOrders = null;
let renderPending = false;
function renderSoon(){
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(()=>{ renderPending = false; render(); });
}

function renderLogin(){
  document.getElementById('root').innerHTML = `
    <div class="login-wrap"><div class="panel">
      <div class="brand"><div class="logo">К</div><h1>Курсив ПВЗ</h1></div>
      <h2>Вход для ПВЗ</h2>
      <p class="muted small">Введите логин и пароль, выданные после одобрения заявки</p>
      <input id="loginInput" class="input" placeholder="Логин (pvz...)" autocomplete="username"/>
      <input id="passInput" class="input" type="password" placeholder="Пароль" autocomplete="current-password"/>
      <div class="err" id="err"></div>
      <button class="btn" id="btnLogin">Войти</button>
    </div></div>
  `;
  const go = async () => {
    const login = document.getElementById('loginInput').value.trim().toLowerCase();
    const pass = document.getElementById('passInput').value;
    const err = document.getElementById('err');
    err.textContent = '';
    if (!login || !pass){ err.textContent = 'Заполните оба поля'; return; }
    document.getElementById('btnLogin').textContent = 'Проверяем…';
    try {
      const snap = await db.ref('pvzLogins/'+login).once('value');
      if (!snap.exists()) throw new Error('Неверный логин или пароль');
      const data = snap.val();
      if (data.password !== pass) throw new Error('Неверный логин или пароль');
      localStorage.setItem('pvz_session', data.pvzId);
      subscribe(data.pvzId);
    } catch(e){
      err.textContent = e.message;
      document.getElementById('btnLogin').textContent = 'Войти';
    }
  };
  document.getElementById('btnLogin').onclick = go;
  document.getElementById('passInput').addEventListener('keydown', e => { if (e.key==='Enter') go(); });
  document.getElementById('loginInput').addEventListener('keydown', e => { if (e.key==='Enter') go(); });
}

function subscribe(pvzId){
  state.pvzId = pvzId;
  if (unsubPvz){ try { unsubPvz(); } catch(e){ console.warn(e); } unsubPvz = null; }
  if (unsubRecent){ try { unsubRecent(); } catch(e){ console.warn(e); } unsubRecent = null; }
  if (unsubIntakeRecent){ try { unsubIntakeRecent(); } catch(e){ console.warn(e); } unsubIntakeRecent = null; }
  if (unsubOrders){ try { unsubOrders(); } catch(e){ console.warn(e); } unsubOrders = null; }

  const pvzRef = db.ref('pvz/'+pvzId);
  const pvzCb = snap => {
    if (!snap.exists()){ logout(); return; }
    state.pvz = snap.val();
    renderSoon();
  };
  pvzRef.on('value', pvzCb);
  unsubPvz = () => pvzRef.off('value', pvzCb);

  const recentRef = db.ref('pvzIssued/'+pvzId);
  const recentCb = snap => { state.recent = snap.val() || {}; renderSoon(); };
  recentRef.on('value', recentCb);
  unsubRecent = () => recentRef.off('value', recentCb);

  const intakeRef = db.ref('pvzIntake/'+pvzId);
  const intakeCb = snap => { state.intakeRecent = snap.val() || {}; renderSoon(); };
  intakeRef.on('value', intakeCb);
  unsubIntakeRecent = () => intakeRef.off('value', intakeCb);

  // Заказы этого ПВЗ (для контроля, что в приёмке только его коробки)
  const ordersRef = db.ref('orderIndex');
  const ordersCb = snap => {
    const all = snap.val() || {};
    const filtered = {};
    for (const [id, o] of Object.entries(all)){
      if (o.pvzId === pvzId) filtered[id] = o;
    }
    state.pvzOrders = filtered;
    renderSoon();
  };
  ordersRef.on('value', ordersCb);
  unsubOrders = () => ordersRef.off('value', ordersCb);
}

function logout(){
  if (unsubPvz){ try { unsubPvz(); } catch(e){ console.warn(e); } unsubPvz = null; }
  if (unsubRecent){ try { unsubRecent(); } catch(e){ console.warn(e); } unsubRecent = null; }
  if (unsubIntakeRecent){ try { unsubIntakeRecent(); } catch(e){ console.warn(e); } unsubIntakeRecent = null; }
  if (unsubOrders){ try { unsubOrders(); } catch(e){ console.warn(e); } unsubOrders = null; }

  localStorage.removeItem('pvz_session');
  state.pvzId = null; state.pvz = null; state.recent = {}; state.intakeRecent = {};
  state.scanResult = null; state.intakeResult = null; state.pvzOrders = {};
  render();
}

/* ================= ВЫДАЧА ================= */
async function findOrderByQr(qrText){
  const orderId = String(qrText||'').trim().replace(/^mkt:/i, '').replace(/%3A/gi, ':').trim();
  if (!orderId) throw new Error('Пустой QR-код');
  const idx = await db.ref('orderIndex/'+orderId).once('value');
  if (!idx.exists()) throw new Error('Заказ не найден');
  const { phone } = idx.val();
  const oSnap = await db.ref('users/'+phone+'/orders/'+orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  return { orderId, phone, order: oSnap.val() };
}
async function findOrderByCode(code6){
  code6 = digits(code6);
  if (code6.length !== 6) throw new Error('Код должен быть из 6 цифр');
  const idx = await db.ref('codeIndex/'+code6).once('value');
  if (!idx.exists()) throw new Error('Код не найден или уже использован');
  const { orderId, phone } = idx.val();
  const oSnap = await db.ref('users/'+phone+'/orders/'+orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  return { orderId, phone, order: oSnap.val() };
}

async function processIssueLookup(input){
  let result;
  if (input.qr) result = await findOrderByQr(input.qr);
  else if (input.code) result = await findOrderByCode(input.code);
  else throw new Error('Нет данных');
  if (result.order.status === 'issued') throw new Error('Заказ уже выдан');
  if (result.order.pvzId !== state.pvzId) throw new Error('Заказ другого ПВЗ');
  const st = result.order.status;
  if (st !== 'ready' && st !== 'pending'){
    throw new Error('Заказ ещё не принят на ПВЗ. Сначала отсканируйте коробку во вкладке «Приёмка»');
  }
  state.scanResult = result;
  renderIssueResult(result);
  openModal('resultModal');
}

async function issueOrder(orderId, phone, code6){
  const oSnap = await db.ref('users/'+phone+'/orders/'+orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  const o = oSnap.val();
  if (o.status === 'issued') throw new Error('Заказ уже выдан');
  if (o.pvzId !== state.pvzId) throw new Error('Заказ другого ПВЗ');
  const updates = {};
  updates['users/'+phone+'/orders/'+orderId+'/status'] = 'issued';
  updates['users/'+phone+'/orders/'+orderId+'/issuedAt'] = Date.now();
  updates['users/'+phone+'/orders/'+orderId+'/issuedBy'] = state.pvzId;
  updates['orderIndex/'+orderId+'/status'] = 'issued';
  updates['codeIndex/'+code6] = null;
  updates['pvzIssued/'+state.pvzId+'/'+orderId] = {
    phone, code6, cell: o.cell, issuedAt: Date.now()
  };
  await db.ref().update(updates);
}

function renderIssueResult({ orderId, phone, order }){
  document.getElementById('resultBody').innerHTML = `
    <div class="modal-head"><b>Заказ найден</b>
      <button class="close-btn" id="btnResClose">✕</button></div>
    <div class="cell-display">
      <div class="cell-label">Ячейка</div>
      <div class="cell-num">${order.cell}</div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="muted small" style="margin-bottom:6px">Состав заказа</div>
      ${order.items.map(i=>`<div style="font-size:14px;padding:2px 0">${i.emoji} ${esc(i.name)} ×${i.qty}</div>`).join('')}
      <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <span class="muted">Итого</span><b>${fmt(order.total)}</b>
      </div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="info-row"><span>Клиент</span><b>${esc(phone)}</b></div>
      <div class="info-row"><span>Код</span><b>${order.code6}</b></div>
    </div>
    <button class="btn ok" id="btnIssue">Выдать заказ</button>
  `;
  document.getElementById('btnResClose').onclick = () => {
    state.scanResult = null; closeModal('resultModal');
  };
  document.getElementById('btnIssue').onclick = async () => {
    if (!state.scanResult) return;
    const btn = document.getElementById('btnIssue');
    btn.disabled = true; btn.textContent = 'Выдаём…';
    try {
      await issueOrder(state.scanResult.orderId, state.scanResult.phone, state.scanResult.order.code6);
      toast('Заказ выдан', 'ok');
      state.scanResult = null;
      closeModal('resultModal');
    } catch(err){ toast(err.message,'err'); }
    btn.disabled = false; btn.textContent = 'Выдать заказ';
  };
}

/* ================= ПРИЁМКА ================= */
async function findOrderByBox(boxCode){
  const code = String(boxCode||'').trim();
  if (!/^box\d{9}$/.test(code)) throw new Error('Неверный формат. Ожидается box + 9 цифр');
  const idx = await db.ref('boxIndex/'+code).once('value');
  if (!idx.exists()) throw new Error('Коробка не найдена');
  const data = idx.val();
  if (data.pvzId !== state.pvzId) throw new Error('Эта коробка для другого ПВЗ');
  const oSnap = await db.ref('users/'+data.phone+'/orders/'+data.orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  return { orderId: data.orderId, phone: data.phone, order: oSnap.val(), boxCode: code };
}

async function processIntakeLookup(boxCode){
  const result = await findOrderByBox(boxCode);
  if (result.order.status === 'ready') throw new Error('Коробка уже принята');
  if (result.order.status === 'issued') throw new Error('Заказ уже выдан клиенту');
  if (result.order.status !== 'transit' && result.order.status !== 'pending'){
    throw new Error('Заказ в недопустимом статусе');
  }
  state.intakeResult = result;
  renderIntakeResult(result);
  openModal('resultModal');
}

async function receiveOrder(orderId, phone, boxCode){
  const oSnap = await db.ref('users/'+phone+'/orders/'+orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  const o = oSnap.val();
  if (o.pvzId !== state.pvzId) throw new Error('Заказ другого ПВЗ');
  if (o.status === 'ready' || o.status === 'issued') throw new Error('Заказ уже принят');
  const updates = {};
  updates['users/'+phone+'/orders/'+orderId+'/status'] = 'ready';
  updates['users/'+phone+'/orders/'+orderId+'/receivedAt'] = Date.now();
  updates['orderIndex/'+orderId+'/status'] = 'ready';
  updates['pvzIntake/'+state.pvzId+'/'+orderId] = {
    phone, boxCode, cell: o.cell, receivedAt: Date.now()
  };
  await db.ref().update(updates);
}

function renderIntakeResult({ orderId, phone, order, boxCode }){
  document.getElementById('resultBody').innerHTML = `
    <div class="modal-head"><b>Получена коробка</b>
      <button class="close-btn" id="btnResClose">✕</button></div>
    <div class="cell-display">
      <div class="cell-label">Положить в ячейку</div>
      <div class="cell-num">${order.cell}</div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="muted small" style="margin-bottom:6px">Состав</div>
      ${order.items.map(i=>`<div style="font-size:14px;padding:2px 0">${i.emoji} ${esc(i.name)} ×${i.qty}</div>`).join('')}
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="info-row"><span>Клиент</span><b>${esc(phone)}</b></div>
      <div class="info-row"><span>Код получения</span><b>${order.code6}</b></div>
      <div class="info-row"><span>Коробка</span><b>${esc(boxCode)}</b></div>
    </div>
    <button class="btn blue" id="btnReceive">Подтвердить приёмку</button>
  `;
  document.getElementById('btnResClose').onclick = () => {
    state.intakeResult = null; closeModal('resultModal');
  };
  document.getElementById('btnReceive').onclick = async () => {
    if (!state.intakeResult) return;
    const btn = document.getElementById('btnReceive');
    btn.disabled = true; btn.textContent = 'Принимаем…';
    try {
      await receiveOrder(state.intakeResult.orderId, state.intakeResult.phone, state.intakeResult.boxCode);
      toast('Коробка принята. Клиент уведомлён', 'ok');
      state.intakeResult = null;
      closeModal('resultModal');
    } catch(err){ toast(err.message,'err'); }
    btn.disabled = false; btn.textContent = 'Подтвердить приёмку';
  };
}

/* ================= РЕНДЕР ================= */
function render(){
  if (!state.pvzId || !state.pvz){ renderLogin(); return; }
  const pvz = state.pvz;
  const recentList = Object.values(state.recent).sort((a,b)=>b.issuedAt-a.issuedAt).slice(0, 5);
  const intakeList = Object.values(state.intakeRecent).sort((a,b)=>b.receivedAt-a.receivedAt).slice(0, 5);

  document.getElementById('root').innerHTML = `
    <div class="header">
      <div class="logo-sm">Курсив <span>ПВЗ</span></div>
      <button class="btn ghost small" id="btnLogout">Выйти</button>
    </div>
    <div class="content">
      <h2>${esc(pvz.name)}</h2>
      <div class="card">
        <div class="info-row"><span>Город</span><b>${esc(getPvzCity(pvz)||'—')}</b></div>
        <div class="info-row"><span>Адрес</span><b style="text-align:right;max-width:60%">${esc(pvz.address)}</b></div>
        <div class="info-row"><span>График</span><b>${esc(pvz.schedule||'—')}</b></div>
        <div class="info-row"><span>Логин</span><b>${esc(pvz.login||'—')}</b></div>
      </div>

      <div class="section">
        <div class="section-title">
          <span>Выдача клиенту</span>
          <span class="pill issue">QR клиента / код</span>
        </div>
        <p class="muted small" style="margin:0 0 12px">Отсканируйте QR клиента или введите 6-значный код</p>
        <button class="btn" id="btnIssueScan">📷 Сканировать QR клиента</button>
        <div class="muted small" style="text-align:center;margin:14px 0 8px">или введите код вручную</div>
        <input id="inlineIssueCode" class="input code-input" inputmode="numeric" maxlength="6" placeholder="000000"/>
        <button class="btn ghost" id="btnInlineIssueGo">Найти заказ</button>
      </div>

      <div class="section">
        <div class="section-title">
          <span>Приёмка коробок</span>
          <span class="pill intake">box + 9 цифр</span>
        </div>
        <p class="muted small" style="margin:0 0 12px">Отсканируйте QR коробки от поставщика или введите код</p>
        <button class="btn blue" id="btnIntakeScan">📦 Сканировать QR коробки</button>
        <div class="muted small" style="text-align:center;margin:14px 0 8px">или введите код коробки</div>
        <input id="inlineIntakeCode" class="input" placeholder="box000000000" autocomplete="off"/>
        <button class="btn ghost" id="btnInlineIntakeGo">Принять коробку</button>
      </div>

      ${intakeList.length ? `<div class="card">
        <h3>Недавно принято</h3>
        ${intakeList.map(r=>`
          <div class="hist">
            <div class="hist-icon blue">📦</div>
            <div style="flex:1">
              <div><b>Ячейка ${r.cell}</b> · ${esc(r.boxCode)}</div>
              <div class="muted small">${esc(r.phone)} · ${new Date(r.receivedAt).toLocaleString('ru-RU')}</div>
            </div>
          </div>`).join('')}
      </div>` : ''}

      ${recentList.length ? `<div class="card">
        <h3>Недавно выдано</h3>
        ${recentList.map(r=>`
          <div class="hist">
            <div class="hist-icon">✓</div>
            <div style="flex:1">
              <div><b>Ячейка ${r.cell}</b> · код ${r.code6}</div>
              <div class="muted small">${esc(r.phone)} · ${new Date(r.issuedAt).toLocaleString('ru-RU')}</div>
            </div>
          </div>`).join('')}
      </div>` : ''}
    </div>
  `;
  document.getElementById('btnLogout').onclick = logout;

  document.getElementById('btnIssueScan').onclick = openIssueScanner;
  document.getElementById('btnIntakeScan').onclick = openIntakeScanner;

  document.getElementById('inlineIssueCode').addEventListener('input', e => { e.target.value = digits(e.target.value); });
  document.getElementById('inlineIssueCode').addEventListener('keydown', e => {
    if (e.key==='Enter') document.getElementById('btnInlineIssueGo').click();
  });
  document.getElementById('btnInlineIssueGo').onclick = async () => {
    try { await processIssueLookup({ code: document.getElementById('inlineIssueCode').value }); }
    catch(err){ toast(err.message,'err'); }
  };

  document.getElementById('inlineIntakeCode').addEventListener('input', e => {
    let v = e.target.value.toLowerCase().replace(/[^a-z0-9]/g,'');
    if (!v.startsWith('box') && v.length > 0){
      // если начали с цифр — добавим box
      v = 'box' + v.replace(/\D/g,'');
    }
    e.target.value = v.slice(0, 12);
  });
  document.getElementById('inlineIntakeCode').addEventListener('keydown', e => {
    if (e.key==='Enter') document.getElementById('btnInlineIntakeGo').click();
  });
  document.getElementById('btnInlineIntakeGo').onclick = async () => {
    try { await processIntakeLookup(document.getElementById('inlineIntakeCode').value); }
    catch(err){ toast(err.message,'err'); }
  };
}

/* ================= СКАНЕР ВЫДАЧИ ================= */
let issueScanner = null, issueScanBusy = false;
async function openIssueScanner(){
  document.getElementById('issueCodeInput').value = '';
  openModal('issueScanModal');
  if (intakeScanner){ try { await intakeScanner.stop(); } catch(e){} }
  if (!issueScanner){
    try { issueScanner = new Html5Qrcode('qrReaderIssue'); }
    catch(e){ console.warn('init issue', e); return; }
  }
  issueScanBusy = false;
  try {
    await issueScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      (text) => onIssueScan(text),
      () => {}
    );
  } catch(err){
    console.warn('camera err', err);
    toast('Камера недоступна — введите код вручную', 'err');
  }
}
async function stopIssueScanner(){
  if (issueScanner){ try { await issueScanner.stop(); } catch(e){} }
}
async function onIssueScan(text){
  if (issueScanBusy) return;
  issueScanBusy = true;
  await stopIssueScanner();
  closeModal('issueScanModal');
  try { await processIssueLookup({ qr: text }); }
  catch(err){ toast(err.message,'err'); }
  issueScanBusy = false;
}

/* ================= СКАНЕР ПРИЁМКИ ================= */
let intakeScanner = null, intakeScanBusy = false;
async function openIntakeScanner(){
  document.getElementById('intakeCodeInput').value = '';
  openModal('intakeScanModal');
  if (issueScanner){ try { await issueScanner.stop(); } catch(e){} }
  if (!intakeScanner){
    try { intakeScanner = new Html5Qrcode('qrReaderIntake'); }
    catch(e){ console.warn('init intake', e); return; }
  }
  intakeScanBusy = false;
  try {
    await intakeScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      (text) => onIntakeScan(text),
      () => {}
    );
  } catch(err){
    console.warn('camera err intake', err);
    toast('Камера недоступна — введите код вручную', 'err');
  }
}
async function stopIntakeScanner(){
  if (intakeScanner){ try { await intakeScanner.stop(); } catch(e){} }
}
async function onIntakeScan(text){
  if (intakeScanBusy) return;
  intakeScanBusy = true;
  await stopIntakeScanner();
  closeModal('intakeScanModal');
  try { await processIntakeLookup(text); }
  catch(err){ toast(err.message,'err'); }
  intakeScanBusy = false;
}

/* ================= ОБРАБОТЧИКИ МОДАЛОК ================= */
document.getElementById('btnIssueScanClose').onclick = async () => {
  closeModal('issueScanModal');
  await stopIssueScanner();
};
document.getElementById('btnIssueCodeGo').onclick = async () => {
  const v = document.getElementById('issueCodeInput').value;
  closeModal('issueScanModal');
  await stopIssueScanner();
  try { await processIssueLookup({ code: v }); }
  catch(err){ toast(err.message,'err'); }
};
document.getElementById('issueCodeInput').addEventListener('input', e => { e.target.value = digits(e.target.value); });
document.getElementById('issueCodeInput').addEventListener('keydown', e => {
  if (e.key==='Enter') document.getElementById('btnIssueCodeGo').click();
});

document.getElementById('btnIntakeScanClose').onclick = async () => {
  closeModal('intakeScanModal');
  await stopIntakeScanner();
};
document.getElementById('btnIntakeCodeGo').onclick = async () => {
  const v = document.getElementById('intakeCodeInput').value;
  closeModal('intakeScanModal');
  await stopIntakeScanner();
  try { await processIntakeLookup(v); }
  catch(err){ toast(err.message,'err'); }
};
document.getElementById('intakeCodeInput').addEventListener('input', e => {
  let v = e.target.value.toLowerCase().replace(/[^a-z0-9]/g,'');
  if (!v.startsWith('box') && v.length > 0){
    v = 'box' + v.replace(/\D/g,'');
  }
  e.target.value = v.slice(0, 12);
});
document.getElementById('intakeCodeInput').addEventListener('keydown', e => {
  if (e.key==='Enter') document.getElementById('btnIntakeCodeGo').click();
});

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-close]')) closeModal(e.target.closest('[data-close]').dataset.close);
});

(function boot(){
  const saved = localStorage.getItem('pvz_session');
  if (saved) subscribe(saved);
  else render();
})();
</script>
</body>
</html>
