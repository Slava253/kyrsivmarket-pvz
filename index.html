<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Курсив Маркет — ПВЗ</title>
<style>
:root{--bg:#0b1020;--card:#141b33;--card2:#1b2444;--text:#e8ecff;--muted:#8b95c2;
  --accent:#5b7cff;--accent2:#7c5bff;--ok:#25d18a;--err:#ff5b6e;--warn:#ffc107;
  --blue:#5b9cff;--orange:#ff8a00;--border:#26305a}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1200px 800px at 20% -10%, #1a2350, #0b1020 60%);
  color:var(--text);min-height:100vh}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.logo-sm{font-weight:700}
.logo-sm span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--border);position:sticky;top:0;
  background:rgba(11,16,32,.9);backdrop-filter:blur(10px);z-index:10}
.tabs .tab{flex:1;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--border);
  color:var(--muted);cursor:pointer;font-family:inherit;font-size:14px;text-align:center}
.tabs .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.content{padding:16px;flex:1;padding-bottom:40px}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
  background:#0f1530;color:var(--text);font-size:15px;margin-bottom:10px;font-family:inherit;outline:none}
.input:focus{border-color:var(--accent)}
textarea.input{resize:vertical;min-height:70px;font-family:inherit}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%238b95c2' stroke-width='1.5' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
.code-input{letter-spacing:8px;text-align:center;font-size:22px;font-family:monospace}
.btn{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:inherit;transition:transform .1s;margin-bottom:8px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:10px;margin:0}
.btn.ok{background:var(--ok)}
.btn.err{background:var(--err)}
.btn.blue{background:linear-gradient(135deg,#4b8cff,#6b6bff)}
.btn:disabled{opacity:.5;cursor:wait}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.panel{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px}
.brand{text-align:center;margin-bottom:20px}
.logo{width:56px;height:56px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-bottom:10px}
.err{color:var(--err);font-size:13px;min-height:18px;margin-bottom:8px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-body{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;
  width:100%;max-width:440px;max-height:92vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head b{font-size:17px}
.close-btn{background:transparent;border:1px solid var(--border);color:var(--muted);width:32px;height:32px;
  border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
#qrReader{width:100%;min-height:220px;border-radius:14px;overflow:hidden;
  background:#0a1024;border:1px solid var(--border)}
#qrReader video{border-radius:14px}
.cell-display{text-align:center;padding:20px;background:linear-gradient(135deg,#243066,#3a2a6e);
  border-radius:20px;margin-bottom:14px}
.cell-num{font-size:48px;font-weight:800;color:#fff;line-height:1}
.cell-label{color:rgba(255,255,255,.7);font-size:12px;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.info-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;align-items:center;gap:12px}
.info-row span:first-child{color:var(--muted)}
.hist{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card2);border-radius:10px;margin-bottom:6px;font-size:13px}
.hist-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hist-icon.green{background:rgba(37,209,138,.15);color:var(--ok)}
.hist-icon.blue{background:rgba(91,156,255,.15);color:var(--blue)}
.hist-icon.orange{background:rgba(255,138,0,.15);color:var(--orange)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;
  background:var(--card2);border:1px solid var(--border);font-size:14px;z-index:9999;animation:up .2s;max-width:90vw}
.toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--err)}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.queue-item{display:flex;gap:12px;padding:12px;background:var(--card2);border:1px solid var(--border);
  border-radius:14px;margin-bottom:8px;cursor:pointer;transition:.15s}
.queue-item:hover{border-color:var(--accent)}
.queue-cell{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#243066,#3a2a6e);
  display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.queue-cell-num{font-size:22px;font-weight:800;line-height:1}
.queue-cell-lbl{font-size:8px;color:rgba(255,255,255,.7);letter-spacing:.5px;margin-top:2px}
.queue-body{flex:1;min-width:0}
.queue-client{font-weight:600;font-size:14px}
.queue-meta{color:var(--muted);font-size:12px;margin-top:2px}
.queue-actions{display:flex;flex-direction:column;gap:4px;justify-content:center}
.queue-actions .btn{width:auto;padding:6px 10px;font-size:12px;margin:0}
.hint-box{padding:12px;border-radius:12px;background:rgba(91,156,255,.08);
  border:1px dashed rgba(91,156,255,.3);font-size:13px;color:#a5b8ff;margin-top:10px}

/* ===== 2D-СКАНЕР ===== */
.scanner-bar{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:linear-gradient(135deg,rgba(91,156,255,.1),rgba(124,91,255,.1));
  border:1px solid rgba(91,156,255,.35);border-radius:14px;margin-bottom:14px;
  position:relative;overflow:hidden;transition:background .25s,box-shadow .25s,border-color .25s;
}
.scanner-bar.flash{
  background:linear-gradient(135deg,rgba(37,209,138,.2),rgba(37,209,138,.08));
  border-color:var(--ok);box-shadow:0 0 0 3px rgba(37,209,138,.25);
}
.scanner-bar.error{
  background:linear-gradient(135deg,rgba(255,91,110,.2),rgba(255,91,110,.08));
  border-color:var(--err);box-shadow:0 0 0 3px rgba(255,91,110,.25);
}
.scanner-icon{font-size:24px;flex-shrink:0}
.scanner-text{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.scanner-text b{font-size:14px}
.scanner-text span{font-size:11px;color:var(--muted);line-height:1.3}
.scanner-pulse{
  width:10px;height:10px;border-radius:50%;background:var(--ok);flex-shrink:0;
  box-shadow:0 0 0 0 rgba(37,209,138,.6);
  animation:pulse 1.6s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(37,209,138,.6)}
  70%{box-shadow:0 0 0 10px rgba(37,209,138,0)}
  100%{box-shadow:0 0 0 0 rgba(37,209,138,0)}
}
.scanner-buffer{
  font-family:monospace;font-size:11px;color:var(--muted);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<!-- Универсальный сканер (камера) -->
<div id="scanModal" class="modal">
  <div class="modal-body">
    <div class="modal-head"><b id="scanTitle">Сканировать</b>
      <button class="close-btn" id="btnScanClose">✕</button></div>
    <div id="qrReader"></div>
    <p class="muted small" style="text-align:center;margin:14px 0 8px" id="scanHint">или введите код</p>
    <input id="scanInput" class="input" placeholder="" autocomplete="off"/>
    <button class="btn" id="btnScanManualGo">Продолжить</button>
    <p class="muted small" style="text-align:center;margin-top:12px;opacity:.7">
      💡 Также можно просто сканировать 2D-сканером — без открытия камеры
    </p>
  </div>
</div>

<!-- Универсальный confirm-модал -->
<div id="confirmModal" class="modal">
  <div class="modal-body" id="confirmBody"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBlZ5ZtyTXgtXxSJAx1jOxwhTrzlHRJmo",
  authDomain: "bk-cashier.firebaseapp.com",
  databaseURL: "https://bk-cashier-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bk-cashier",
  storageBucket: "bk-cashier.firebasestorage.app",
  messagingSenderId: "385000840969",
  appId: "1:385000840969:web:1ec8d09176b6551dc0fdd8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
db.goOnline();

const fmt = n => new Intl.NumberFormat('ru-RU').format(Number(n)||0) + ' ₽';
const digits = v => String(v||'').replace(/\D/g,'');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast ' + (type||'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

function statusLabel(s){
  if (s === 'pending' || s === 'transit') return 'В пути';
  if (s === 'ready') return 'Готов к выдаче';
  if (s === 'issued') return 'Выдан';
  if (s === 'returned') return 'Возвращён';
  return s || '—';
}
function getPvzCity(pvz){
  if (!pvz) return '';
  if (pvz.city) return pvz.city;
  const parts = String(pvz.address||'').split(',');
  return parts[0] ? parts[0].trim() : '';
}

/* ================= СОСТОЯНИЕ ================= */
const state = {
  pvzId: null, pvz: null, tab: 'issue',
  recentIssued: {}, recentIntake: {}, recentReturns: {},
  pvzOrders: {},
  activeOrders: {},
  scanMode: 'issue',
  confirmType: null,
  confirmData: null,
};
let unsubPvz = null, unsubIssued = null, unsubIntake = null, unsubReturns = null, unsubOrders = null;
let renderPending = false;
function renderSoon(){
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(()=>{ renderPending = false; render(); });
}

/* ================= ОЧЕРЕДЬ ================= */
function queueKey(){ return 'pvz_queue_' + state.pvzId; }
function loadQueue(){
  try {
    const raw = localStorage.getItem(queueKey());
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return {};
    return parsed;
  } catch(e){ return {}; }
}
function saveQueue(){
  try { localStorage.setItem(queueKey(), JSON.stringify(state.activeOrders)); } catch(e){}
}
function addToQueue(orderId, phone, order){
  if (state.activeOrders[orderId]){
    toast('Заказ уже в списке в работе', 'err');
    return false;
  }
  state.activeOrders[orderId] = {
    orderId, phone,
    code6: order.code6, cell: order.cell,
    items: order.items || [], total: order.total || 0,
    addedAt: Date.now()
  };
  saveQueue();
  return true;
}
function removeFromQueue(orderId){
  delete state.activeOrders[orderId];
  saveQueue();
}
function queueCount(){ return Object.keys(state.activeOrders).length; }

/* ================= АВТОРИЗАЦИЯ ================= */
function renderLogin(){
  document.getElementById('root').innerHTML = `
    <div class="login-wrap"><div class="panel">
      <div class="brand"><div class="logo">К</div><h1>Курсив ПВЗ</h1></div>
      <h2>Вход для ПВЗ</h2>
      <p class="muted small">Введите логин и пароль, выданные после одобрения заявки</p>
      <input id="loginInput" class="input" placeholder="Логин (pvz...)" autocomplete="username"/>
      <input id="passInput" class="input" type="password" placeholder="Пароль" autocomplete="current-password"/>
      <div class="err" id="err"></div>
      <button class="btn" id="btnLogin">Войти</button>
    </div></div>
  `;
  const go = async () => {
    const login = document.getElementById('loginInput').value.trim().toLowerCase();
    const pass = document.getElementById('passInput').value;
    const err = document.getElementById('err');
    err.textContent = '';
    if (!login || !pass){ err.textContent = 'Заполните оба поля'; return; }
    document.getElementById('btnLogin').textContent = 'Проверяем…';
    try {
      const snap = await db.ref('pvzLogins/'+login).once('value');
      if (!snap.exists()) throw new Error('Неверный логин или пароль');
      const data = snap.val();
      if (data.password !== pass) throw new Error('Неверный логин или пароль');
      localStorage.setItem('pvz_session', data.pvzId);
      subscribe(data.pvzId);
    } catch(e){
      err.textContent = e.message;
      document.getElementById('btnLogin').textContent = 'Войти';
    }
  };
  document.getElementById('btnLogin').onclick = go;
  document.getElementById('passInput').addEventListener('keydown', e => { if (e.key==='Enter') go(); });
  document.getElementById('loginInput').addEventListener('keydown', e => { if (e.key==='Enter') go(); });
}

function subscribe(pvzId){
  state.pvzId = pvzId;
  if (unsubPvz){ try { unsubPvz(); } catch(e){} unsubPvz = null; }
  if (unsubIssued){ try { unsubIssued(); } catch(e){} unsubIssued = null; }
  if (unsubIntake){ try { unsubIntake(); } catch(e){} unsubIntake = null; }
  if (unsubReturns){ try { unsubReturns(); } catch(e){} unsubReturns = null; }
  if (unsubOrders){ try { unsubOrders(); } catch(e){} unsubOrders = null; }

  state.activeOrders = loadQueue();

  const pvzRef = db.ref('pvz/'+pvzId);
  const pvzCb = snap => {
    if (!snap.exists()){ logout(); return; }
    state.pvz = snap.val();
    renderSoon();
  };
  pvzRef.on('value', pvzCb);
  unsubPvz = () => pvzRef.off('value', pvzCb);

  const issuedRef = db.ref('pvzIssued/'+pvzId);
  const issuedCb = snap => { state.recentIssued = snap.val() || {}; renderSoon(); };
  issuedRef.on('value', issuedCb);
  unsubIssued = () => issuedRef.off('value', issuedCb);

  const intakeRef = db.ref('pvzIntake/'+pvzId);
  const intakeCb = snap => { state.recentIntake = snap.val() || {}; renderSoon(); };
  intakeRef.on('value', intakeCb);
  unsubIntake = () => intakeRef.off('value', intakeCb);

  const returnsRef = db.ref('pvzReturns/'+pvzId);
  const returnsCb = snap => { state.recentReturns = snap.val() || {}; renderSoon(); };
  returnsRef.on('value', returnsCb);
  unsubReturns = () => returnsRef.off('value', returnsCb);

  const ordersRef = db.ref('orderIndex');
  const ordersCb = snap => {
    const all = snap.val() || {};
    const filtered = {};
    for (const [id, o] of Object.entries(all)) if (o.pvzId === pvzId) filtered[id] = o;
    state.pvzOrders = filtered;
    let changed = false;
    for (const id of Object.keys(state.activeOrders)){
      const o = filtered[id];
      if (!o || o.status !== 'ready'){
        delete state.activeOrders[id];
        changed = true;
      }
    }
    if (changed) saveQueue();
    renderSoon();
  };
  ordersRef.on('value', ordersCb);
  unsubOrders = () => ordersRef.off('value', ordersCb);
}

function logout(){
  if (unsubPvz){ try { unsubPvz(); } catch(e){} unsubPvz = null; }
  if (unsubIssued){ try { unsubIssued(); } catch(e){} unsubIssued = null; }
  if (unsubIntake){ try { unsubIntake(); } catch(e){} unsubIntake = null; }
  if (unsubReturns){ try { unsubReturns(); } catch(e){} unsubReturns = null; }
  if (unsubOrders){ try { unsubOrders(); } catch(e){} unsubOrders = null; }

  localStorage.removeItem('pvz_session');
  state.pvzId = null; state.pvz = null;
  state.recentIssued = {}; state.recentIntake = {}; state.recentReturns = {};
  state.pvzOrders = {}; state.activeOrders = {};
  state.confirmType = null; state.confirmData = null;
  render();
}

/* ================= ПОИСК ЗАКАЗОВ ================= */
async function findOrderByQr(qrText){
  const orderId = String(qrText||'').trim().replace(/^mkt:/i, '').replace(/%3A/gi, ':').trim();
  if (!orderId) throw new Error('Пустой QR-код');
  const idx = await db.ref('orderIndex/'+orderId).once('value');
  if (!idx.exists()) throw new Error('Заказ не найден');
  const { phone } = idx.val();
  const oSnap = await db.ref('users/'+phone+'/orders/'+orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  return { orderId, phone, order: oSnap.val() };
}
async function findOrderByCode(code6){
  code6 = digits(code6);
  if (code6.length !== 6) throw new Error('Код должен быть из 6 цифр');
  const idx = await db.ref('codeIndex/'+code6).once('value');
  if (!idx.exists()) throw new Error('Код не найден или уже использован');
  const { orderId, phone } = idx.val();
  const oSnap = await db.ref('users/'+phone+'/orders/'+orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  return { orderId, phone, order: oSnap.val() };
}
async function findOrderByBox(boxCode){
  const code = String(boxCode||'').trim().toLowerCase();
  if (!/^box\d{9}$/.test(code)) throw new Error('Неверный формат. Ожидается box + 9 цифр');
  const idx = await db.ref('boxIndex/'+code).once('value');
  if (!idx.exists()) throw new Error('Коробка не найдена');
  const data = idx.val();
  if (data.pvzId !== state.pvzId) throw new Error('Эта коробка для другого ПВЗ');
  const oSnap = await db.ref('users/'+data.phone+'/orders/'+data.orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  return { orderId: data.orderId, phone: data.phone, order: oSnap.val(), boxCode: code };
}

/* ================= ОПЕРАЦИИ ================= */
async function issueOrder(orderId, phone){
  const oSnap = await db.ref('users/'+phone+'/orders/'+orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  const o = oSnap.val();
  if (o.status === 'issued') throw new Error('Заказ уже выдан');
  if (o.status === 'returned') throw new Error('Заказ возвращён');
  if (o.status !== 'ready') throw new Error('Нельзя выдать: статус «' + statusLabel(o.status) + '»');
  if (o.pvzId !== state.pvzId) throw new Error('Заказ другого ПВЗ');
  const updates = {};
  updates['users/'+phone+'/orders/'+orderId+'/status'] = 'issued';
  updates['users/'+phone+'/orders/'+orderId+'/issuedAt'] = Date.now();
  updates['users/'+phone+'/orders/'+orderId+'/issuedBy'] = state.pvzId;
  updates['orderIndex/'+orderId+'/status'] = 'issued';
  updates['codeIndex/'+o.code6] = null;
  updates['pvzIssued/'+state.pvzId+'/'+orderId] = {
    phone, code6: o.code6, cell: o.cell, issuedAt: Date.now()
  };
  await db.ref().update(updates);
}

async function receiveOrder(orderId, phone, boxCode){
  const oSnap = await db.ref('users/'+phone+'/orders/'+orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  const o = oSnap.val();
  if (o.pvzId !== state.pvzId) throw new Error('Заказ другого ПВЗ');
  if (o.status !== 'transit' && o.status !== 'pending') throw new Error('Заказ в недопустимом статусе: ' + statusLabel(o.status));
  const updates = {};
  updates['users/'+phone+'/orders/'+orderId+'/status'] = 'ready';
  updates['users/'+phone+'/orders/'+orderId+'/receivedAt'] = Date.now();
  updates['orderIndex/'+orderId+'/status'] = 'ready';
  updates['pvzIntake/'+state.pvzId+'/'+orderId] = {
    phone, boxCode, cell: o.cell, receivedAt: Date.now()
  };
  await db.ref().update(updates);
}

async function returnOrder(orderId, phone, reason){
  reason = String(reason||'').trim();
  if (reason.length < 3) throw new Error('Укажите причину возврата (минимум 3 символа)');
  const oSnap = await db.ref('users/'+phone+'/orders/'+orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  const o = oSnap.val();
  if (o.pvzId !== state.pvzId) throw new Error('Заказ другого ПВЗ');
  if (o.status === 'returned') throw new Error('Заказ уже возвращён');
  if (o.status !== 'issued' && o.status !== 'ready')
    throw new Error('Возврат возможен только для готовых или выданных заказов');
  const updates = {};
  updates['users/'+phone+'/orders/'+orderId+'/status'] = 'returned';
  updates['users/'+phone+'/orders/'+orderId+'/returnReason'] = reason;
  updates['users/'+phone+'/orders/'+orderId+'/returnedAt'] = Date.now();
  updates['users/'+phone+'/orders/'+orderId+'/returnedBy'] = state.pvzId;
  updates['orderIndex/'+orderId+'/status'] = 'returned';
  updates['orderIndex/'+orderId+'/returnReason'] = reason;
  updates['pvzReturns/'+state.pvzId+'/'+orderId] = {
    phone, code6: o.code6, cell: o.cell, reason, returnedAt: Date.now()
  };
  await db.ref().update(updates);
  removeFromQueue(orderId);
}

/* ================= ЛОГИКА СКАНА ================= */
async function handleIssueLookup(input){
  let result;
  if (input.qr) result = await findOrderByQr(input.qr);
  else if (input.code) result = await findOrderByCode(input.code);
  else throw new Error('Нет данных');
  if (result.order.pvzId !== state.pvzId) throw new Error('Заказ другого ПВЗ');

  if (result.order.status === 'issued'){
    openReturnForm(result);
    return;
  }
  if (result.order.status === 'returned') throw new Error('Заказ уже возвращён');
  if (result.order.status === 'transit' || result.order.status === 'pending')
    throw new Error('Заказ ещё не поступил в ПВЗ. Примите коробку во вкладке «Приёмка»');
  if (result.order.status !== 'ready') throw new Error('Неизвестный статус: ' + statusLabel(result.order.status));

  const added = addToQueue(result.orderId, result.phone, result.order);
  render();
  if (added) toast('Добавлен в работу · ячейка ' + result.order.cell, 'ok');
}

async function handleIntakeLookup(boxCode){
  const result = await findOrderByBox(boxCode);
  if (result.order.status === 'ready') throw new Error('Коробка уже принята');
  if (result.order.status === 'issued') throw new Error('Заказ уже выдан');
  if (result.order.status === 'returned') throw new Error('Заказ возвращён');
  if (result.order.status !== 'transit' && result.order.status !== 'pending')
    throw new Error('Заказ в недопустимом статусе');
  showReceiveConfirm(result);
}

/* ================= УНИВЕРСАЛЬНЫЙ 2D-СКАНЕР ================= */
let globalScanBuffer = '';
let globalScanLastTime = 0;
const SCAN_TIMEOUT_MS = 120;   // пауза между символами >120мс = сброс буфера (значит не скан)
const SCAN_MIN_LEN = 4;        // минимум символов для скана

function flashScannerBar(ok){
  const bar = document.getElementById('scannerBar');
  if (!bar) return;
  bar.classList.remove('flash','error');
  bar.classList.add(ok ? 'flash' : 'error');
  clearTimeout(bar._flashTimer);
  bar._flashTimer = setTimeout(() => bar.classList.remove('flash','error'), 700);
}

async function handleGlobalScan(raw){
  const v = String(raw||'').trim();
  if (!v) return;
  console.log('[2D scan]', v);

  const low = v.toLowerCase();
  try {
    if (/^mkt:/i.test(v)){
      // QR клиента
      flashScannerBar(true);
      await handleIssueLookup({ qr: v });
    } else if (/^box\d{9}$/.test(low)){
      // QR коробки
      flashScannerBar(true);
      await handleIntakeLookup(low);
    } else if (/^\d{6}$/.test(v)){
      // 6-значный код клиента
      flashScannerBar(true);
      await handleIssueLookup({ code: v });
    } else if (/^[a-z0-9_-]{15,}$/i.test(v)){
      // Просто orderId (совместимость)
      flashScannerBar(true);
      await handleIssueLookup({ qr: 'mkt:' + v });
    } else {
      flashScannerBar(false);
      toast('Неизвестный QR: ' + v.slice(0, 40), 'err');
    }
  } catch(err){
    flashScannerBar(false);
    toast(err.message, 'err');
  }
}

// Глобальный слушатель: собирает быстрый ввод с любой клавиатуры (2D-сканер)
document.addEventListener('keydown', (e) => {
  // Если фокус в поле ввода — не перехватываем (кроме самого сканера, но у нас его нет)
  const ae = document.activeElement;
  const isEditable = ae && ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName);
  if (isEditable) return;

  const now = Date.now();
  if (now - globalScanLastTime > SCAN_TIMEOUT_MS) globalScanBuffer = '';
  globalScanLastTime = now;

  if (e.key === 'Enter' || e.keyCode === 13){
    const buf = globalScanBuffer.trim();
    globalScanBuffer = '';
    if (buf.length >= SCAN_MIN_LEN){
      e.preventDefault();
      e.stopPropagation();
      handleGlobalScan(buf);
    }
    return;
  }

  // Символы (не Ctrl/Alt/Meta)
  if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey){
    globalScanBuffer += e.key;
    // обновляем визуальный индикатор буфера
    const bufEl = document.getElementById('scannerBuffer');
    if (bufEl) bufEl.textContent = globalScanBuffer.slice(-24);
  }
});

/* ================= КАМЕРА-СКАНЕР ================= */
let scanner = null, scanBusy = false;
async function openScanner(mode){
  state.scanMode = mode;
  const title = mode === 'issue' ? 'Сканировать заказ клиента' : 'Сканировать QR коробки';
  const hint = mode === 'issue' ? 'или введите 6-значный код' : 'или введите код коробки';
  document.getElementById('scanTitle').textContent = title;
  document.getElementById('scanHint').textContent = hint;
  const inp = document.getElementById('scanInput');
  inp.value = '';
  inp.placeholder = mode === 'issue' ? '000000' : 'box000000000';
  inp.className = 'input' + (mode === 'issue' ? ' code-input' : '');
  inp.setAttribute('maxlength', mode === 'issue' ? '6' : '12');
  inp.oninput = (e) => {
    if (mode === 'issue'){
      e.target.value = digits(e.target.value);
    } else {
      let v = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '');
      if (!v.startsWith('box') && v.length > 0) v = 'box' + v.replace(/\D/g, '');
      e.target.value = v.slice(0, 12);
    }
  };
  openModal('scanModal');
  if (!scanner){
    try { scanner = new Html5Qrcode('qrReader'); }
    catch(e){ console.warn('init', e); return; }
  }
  scanBusy = false;
  try {
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      (text) => onScan(text),
      () => {}
    );
  } catch(err){
    console.warn('camera err', err);
    toast('Камера недоступна — введите код вручную', 'err');
  }
}
async function stopScanner(){
  if (scanner){ try { await scanner.stop(); } catch(e){} }
}
async function onScan(text){
  if (scanBusy) return;
  scanBusy = true;
  await stopScanner();
  closeModal('scanModal');
  const mode = state.scanMode;
  try {
    if (mode === 'issue') await handleIssueLookup({ qr: text });
    else await handleIntakeLookup(text);
  } catch(err){ toast(err.message, 'err'); }
  scanBusy = false;
}
document.getElementById('btnScanClose').onclick = async () => {
  closeModal('scanModal');
  await stopScanner();
};
document.getElementById('btnScanManualGo').onclick = async () => {
  const v = document.getElementById('scanInput').value;
  const mode = state.scanMode;
  closeModal('scanModal');
  await stopScanner();
  try {
    if (mode === 'issue') await handleIssueLookup({ code: v });
    else await handleIntakeLookup(v);
  } catch(err){ toast(err.message, 'err'); }
};

            <div><b>Ячейка ${r.cell}</b> · код ${r.code6}</div>
            <div class="muted small">${esc(r.phone)} · ${esc(r.reason||'')}</div>
            <div class="muted small">${new Date(r.returnedAt).toLocaleString('ru-RU')}</div>
          </div>
        </div>`).join('')}
    </div>` : ''}
  `;
}

function renderIntakeTab(){
  const intakeList = Object.values(state.recentIntake).sort((a,b)=>b.receivedAt-a.receivedAt).slice(0, 10);
  return `
    <div class="card">
      <h3>Приёмка коробок</h3>
      <p class="muted small" style="margin:0 0 12px">Отсканируйте QR коробки (<b>box + 9 цифр</b>) или введите код</p>
      <button class="btn blue" id="btnIntakeScan">📦 Сканировать камерой</button>
      <div class="muted small" style="text-align:center;margin:14px 0 8px">или введите код коробки</div>
      <input id="inlineIntakeCode" class="input" placeholder="box000000000" autocomplete="off"/>
      <button class="btn ghost" id="btnInlineIntakeGo">Принять коробку</button>
      <div class="hint-box">
        🎯 <b>2D-сканер</b> — просто наведите и отсканируйте QR коробки в любом месте экрана. Код автоматически определится по префиксу <code>box</code>.
      </div>
    </div>

    ${intakeList.length ? `<div class="card">
      <h3>Недавно принято</h3>
      ${intakeList.map(r=>`
        <div class="hist">
          <div class="hist-icon blue">📦</div>
          <div style="flex:1">
            <div><b>Ячейка ${r.cell}</b> · ${esc(r.boxCode)}</div>
            <div class="muted small">${esc(r.phone)} · ${new Date(r.receivedAt).toLocaleString('ru-RU')}</div>
          </div>
        </div>`).join('')}
    </div>` : ''}
  `;
}

/* ================= ОБРАБОТЧИК КЛИКОВ ================= */
document.addEventListener('click', (e) => {
  const closeBtn = e.target.closest('[data-close]');
  if (closeBtn){ closeModal(closeBtn.dataset.close); return; }

  const queueOpen = e.target.closest('[data-queueopen]');
  if (queueOpen){
    e.preventDefault();
    e.stopPropagation();
    openConfirm('queue', { orderId: queueOpen.dataset.queueopen });
    return;
  }
});

/* ================= СТАРТ ================= */
(function boot(){
  const saved = localStorage.getItem('pvz_session');
  if (saved) subscribe(saved);
  else render();
})();
</script>
</body>
</html>
